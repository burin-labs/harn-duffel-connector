[package]
name = "harn-duffel-connector"
version = "0.1.0"
description = "Pure-Harn Duffel connector for flight search, test booking, and reconciliation."
license = "MIT OR Apache-2.0"
repository = "https://github.com/burin-labs/harn-duffel-connector"
harn = ">=0.10.70,<0.11"
docs_url = "README.md"

[exports]
default = "src/lib.harn"

[[providers]]
id = "duffel"
connector = { harn = "src/lib.harn" }
capabilities = ["pagination"]

[providers.service]
name = "Duffel"
description = "Searches current flight offers and creates governed test orders."

[[providers.service.operations]]
id = "places.list"
capability = "flights.research"
purpose = "Find the airport or city requested for flight research."
effect = "read"
environments = ["test"]
evidence = ["citation", "current_provider_state"]
redaction = ["error_body"]

[[providers.service.operations]]
id = "offer_requests.create"
capability = "flights.research"
purpose = "Search current test flight offers for the requested itinerary."
effect = "read"
environments = ["test"]
evidence = ["citation", "current_provider_state"]
redaction = ["request_body", "error_body"]

[[providers.service.operations]]
id = "offer_requests.get"
capability = "flights.research"
purpose = "Read the current state of one flight search."
effect = "read"
environments = ["test"]
evidence = ["citation", "current_provider_state"]
redaction = ["error_body"]

[[providers.service.operations]]
id = "offers.list"
capability = "flights.research"
purpose = "Compare current test offers from one flight search."
effect = "read"
environments = ["test"]
evidence = ["citation", "current_provider_state"]
redaction = ["error_body"]

[[providers.service.operations]]
id = "offers.get"
capability = "flights.research"
purpose = "Refresh one test offer before presenting or ordering it."
effect = "read"
environments = ["test"]
evidence = ["citation", "current_provider_state", "fresh_quote"]
redaction = ["error_body"]

[[providers.service.operations]]
id = "orders.list"
capability = "flights.orders.read"
purpose = "List test orders for status and reconciliation."
effect = "read"
environments = ["test"]
evidence = ["current_provider_state"]
redaction = ["response_body", "error_body"]

[[providers.service.operations]]
id = "orders.get"
capability = "flights.orders.read"
purpose = "Read the current provider state of one test order."
effect = "read"
environments = ["test"]
evidence = ["current_provider_state"]
redaction = ["response_body", "error_body"]

[[providers.service.operations]]
id = "orders.create"
capability = "flights.book"
purpose = "Create the exact Duffel test order reviewed by the user."
effect = "consequential"
environments = ["test"]
evidence = ["fresh_quote", "user_confirmation", "current_provider_state"]
external_spend = "commit"
reconciliation = "required"
test_profile = "fictional_required"
redaction = ["request_body", "response_body", "error_body"]

[providers.service.operations.protected_profile]
required = ["legal_identity", "birth_date", "contact_details"]
optional = ["loyalty_accounts"]

[[providers.service.operations.protected_profile.conditional]]
condition = "offer_requires_travel_documents"
field_classes = ["travel_documents"]

[providers.setup]
auth_type = "api_key"
flow = "manual"
required_secrets = ["duffel/test-access-token"]
credential_environment = [
  { secret = "duffel/test-access-token", environment_names = ["DUFFEL_TEST_KEY"] },
]
setup_command = ["harn", "connect", "duffel"]
validation_command = ["harn", "connect", "status", "--connector", "duffel", "--json"]

[[providers.setup.health_checks]]
id = "test-access-token"
kind = "secret"
secret = "duffel/test-access-token"

[providers.setup.recovery]
missing_auth = "Store a Duffel test token as duffel/test-access-token before enabling the connector."
expired_credentials = "Replace the expired Duffel test token and rerun validation."
revoked_credentials = "Replace the revoked Duffel test token and rerun validation."
missing_scopes = "Duffel test tokens do not use OAuth scopes."
inaccessible_resource = "Confirm the resource was created by the same Duffel test account."
transient_provider_outage = "Retry read-only research after Duffel and airline sandboxes are healthy."

[connector_contract]
version = 2

[[connector_contract.fixtures]]
provider = "duffel"
name = "outbound-only webhook rejection"
kind = "webhook"
body_json = { event = "order.created" }
expect_type = "reject"
expect_response_status = 405
expect_event_count = 0

[dependencies]
